# typos source code spell checker configuration
# Non-English locale files contain correct foreign words that the
# English spell checker flags as typos (e.g. German "Alle", French "Termine")
#
# This exclusion is deliberate and should stay. `typos` matches an English
# misspelling corpus rather than per-language dictionaries, so pointing it at
# these files yields 1494 findings and no true positives — `ist`→`is`,
# `contactos`→`contacts`, `sur`→`sure`, `Impossibile`→`Impossible`.
# Language-aware checking belongs in scripts/check-locale-quality.py and the
# grammar tooling, not here.

[files]
extend-exclude = [
    "de.json",
    "fr.json",
    "es.json",
    "it.json",
    # Leading **/ so the pattern still matches when a caller passes an
    # absolute path — the pre-push hook does, and a bare relative pattern
    # silently fails to exclude anything in that case.
    "**/check-locale-quality.py",
]

# The quality checker quotes register markers verbatim in its patterns and
# docstring. These are correct German and Italian words, not typos.
[default.extend-words]
Sie = "Sie"
sie = "sie"
Lei = "Lei"
